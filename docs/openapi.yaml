components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID Token acquired from Firebase Client Authentication SDK.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Missing or malformed Authorization header.

    Location:
      type: object
      required:
        - lat
        - lng
      properties:
        lat:
          type: number
          format: float
          minimum: -90.0
          maximum: 90.0
          example: 26.8467
        lng:
          type: number
          format: float
          minimum: -180.0
          maximum: 180.0
          example: 80.9462

    Component:
      type: object
      required:
        - type
        - model
        - serial
      properties:
        type:
          type: string
          example: solar_panel
        model:
          type: string
          example: Mono-PERC-550W
        serial:
          type: string
          example: SN-550-001
        warranty_until:
          type: string
          format: date-time
          example: "2036-08-01T00:00:00Z"

    UserProfile:
      type: object
      properties:
        uid:
          type: string
          example: uid_owner
        email:
          type: string
          format: email
          example: owner@solar.com
        name:
          type: string
          example: Solar Owner
        role:
          type: string
          enum: [owner, technician, admin]
          example: owner
        created_at:
          type: string
          format: date-time

    TelemetryReading:
      type: object
      properties:
        id:
          type: string
          example: read_1787335200
        timestamp:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00+00:00"
        unix_timestamp:
          type: integer
          example: 1787335200
        voltage:
          type: number
          example: 48.2
        current:
          type: number
          example: 10.5
        power:
          type: number
          example: 506.1
        expected_power:
          type: number
          example: 550.0
        performance_ratio:
          type: number
          example: 0.9202
        irradiance:
          type: number
          example: 850.0
        temperature_ambient:
          type: number
          example: 28.5
        temperature_panel:
          type: number
          example: 42.0
        humidity:
          type: number
          example: 45.0
        system_id:
          type: string
          example: SYS-OWNER001
        site_id:
          type: string
          example: SITE-OWNER001

    IngestPayload:
      type: object
      required:
        - voltage
        - current
        - power
        - expected_power
      properties:
        voltage:
          type: number
          example: 48.2
        current:
          type: number
          example: 10.5
        power:
          type: number
          example: 506.1
        expected_power:
          type: number
          example: 550.0
        timestamp:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00Z"
        irradiance:
          type: number
          example: 850.0
        lux:
          type: number
          example: 102000.0
        temperature_ambient:
          type: number
          example: 28.5
        temperature_panel:
          type: number
          example: 42.0
        humidity:
          type: number
          example: 45.0
        system_id:
          type: string
          example: SYS-OWNER001
        site_id:
          type: string
          example: SITE-OWNER001

    Alert:
      type: object
      properties:
        id:
          type: string
          example: alert_123
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          example: performance_drop
        severity:
          type: string
          enum: [warning, critical]
          example: warning
        performance_ratio:
          type: number
          example: 0.58
        threshold:
          type: number
          example: 0.70
        active:
          type: boolean
          example: true
        status:
          type: string
          example: active
        message:
          type: string
          example: "Performance Degradation Detected! Average PR dropped to 0.58"
        lost_energy_kwh:
          type: number
          example: 0.45

    Site:
      type: object
      properties:
        site_id:
          type: string
          example: SITE-AB12CD34
        owner_uid:
          type: string
          example: uid_owner
        site_name:
          type: string
          example: Headquarters Solar Array
        address:
          type: string
          example: 123 Solar Way, Lucknow, UP
        location:
          $ref: '#/components/schemas/Location'
        created_at:
          type: string
          format: date-time

    SiteCreatePayload:
      type: object
      required:
        - site_name
        - location
      properties:
        site_name:
          type: string
          example: Headquarters Solar Array
        address:
          type: string
          example: 123 Solar Way, Lucknow, UP
        location:
          $ref: '#/components/schemas/Location'

    System:
      type: object
      properties:
        system_id:
          type: string
          example: SYS-12345678
        owner_uid:
          type: string
          example: uid_owner
        site_id:
          type: string
          example: SITE-AB12CD34
        name:
          type: string
          example: Main Rooftop Solar Array
        location:
          $ref: '#/components/schemas/Location'
        installation_date:
          type: string
          format: date-time
        panel_capacity_watts:
          type: number
          example: 5000
        inverter_type:
          type: string
          example: String Inverter
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        created_at:
          type: string
          format: date-time

    SystemCreatePayload:
      type: object
      required:
        - name
        - location
        - installation_date
        - panel_capacity_watts
        - inverter_type
      properties:
        name:
          type: string
          example: Main Rooftop Solar Array
        location:
          $ref: '#/components/schemas/Location'
        installation_date:
          type: string
          format: date-time
          example: "2026-08-01T00:00:00Z"
        panel_capacity_watts:
          type: number
          example: 5000
        inverter_type:
          type: string
          example: String Inverter
        components:
          type: array
          items:
            $ref: '#/components/schemas/Component'
        qr_code_data:
          type: string
        site_id:
          type: string
          example: SITE-AB12CD34

    Assignment:
      type: object
      properties:
        assignment_id:
          type: string
          example: ASG-12345678
        technician_uid:
          type: string
          example: uid_tech
        system_id:
          type: string
          example: SYS-12345678
        site_id:
          type: string
          example: SITE-AB12CD34
        assigned_by:
          type: string
          example: uid_admin
        status:
          type: string
          example: active
        assigned_at:
          type: string
          format: date-time

    ReportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        report_type:
          type: string
