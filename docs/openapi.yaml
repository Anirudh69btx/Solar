openapi: 3.0.3
info:
  title: Solar PV Monitoring System API
  description: |
    Production REST API for the Solar PV Monitoring System.
    
    Provides IoT sensor telemetry ingestion, automated real-time analytics,
    rule-based chatbot, machine learning regression predictions, multi-site & system management,
    technician assignment RBAC, document lifecycle with Cloud Storage, secure QR Access Portal,
    and platform-wide administrative oversight.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local Development Server
  - url: https://solar.monitoring.internal
    description: Production Internal Cluster

tags:
  - name: Health & Liveness
    description: Liveness and dependency readiness health checks
  - name: Authentication & Users
    description: Firebase Authentication, registration, and user profiles
  - name: Telemetry & Ingest
    description: Sensor telemetry ingestion and latest readings
  - name: Alerts & Engine
    description: Active alerts querying and manual analysis execution
  - name: Solar Sites
    description: Multi-site physical installation hierarchy
  - name: Solar Systems
    description: Solar installation CRUD and ownership management
  - name: Technician Assignments
    description: Field technician site and system dispatching
  - name: Solar Reports
    description: Daily, weekly, and monthly solar generation and PR analytics
  - name: Machine Learning & Health
    description: Power prediction regression and system health scoring
  - name: Documents & Files
    description: Document lifecycle management, validation, and Cloud Storage
  - name: QR Code & Access Portal
    description: Safe field QR generation and restricted QR workspace
  - name: Admin Panel
    description: Administrative oversight, global KPIs, users, and audit logs
  - name: AI Chatbot
    description: Natural language assistant for telemetry and solar insights

paths:
  /api/health:
    get:
      tags:
        - Health & Liveness
      summary: Liveness health check
      description: Returns server liveness status and UTC timestamp. Does not require authentication.
      responses:
        '200':
          description: Service is alive and healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: Solar Monitoring Backend API
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-08-21T18:00:00.000000+00:00"

  /api/health/ready:
    get:
      tags:
        - Health & Liveness
      summary: Readiness dependency check
      description: Checks connectivity to Firestore database client.
      responses:
        '200':
          description: Backend dependencies are ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  service:
                    type: string
                    example: Solar Monitoring Backend API
                  database:
                    type: string
                    example: connected
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: Database connection unavailable

  /api/readings/latest:
    get:
      tags:
        - Telemetry & Ingest
      summary: Retrieve latest sensor readings
      description: Returns recent telemetry readings ordered by timestamp descending.
      parameters:
        - name: limit
          in: query
          description: Number of readings to fetch (1..200, default 50).
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: List of telemetry readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryReading'
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/ingest:
    post:
      tags:
        - Telemetry & Ingest
      summary: Ingest sensor telemetry reading
      description: Ingests a new IoT reading, persists it to Firestore, and triggers the performance analysis engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestPayload'
      responses:
        '201':
          description: Telemetry reading ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Sensor data ingested successfully
                  doc_id:
                    type: string
                    example: read_1787335200
                  data:
                    $ref: '#/components/schemas/TelemetryReading'
                  analysis:
                    $ref: '#/components/schemas/AnalysisSummary'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/alerts:
    get:
      tags:
        - Alerts & Engine
      summary: Retrieve active alerts
      description: Fetches alerts from the Firestore alerts collection, ordered by timestamp descending.
      parameters:
        - name: active_only
          in: query
          description: Filter for active alerts only (default true).
          required: false
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: List of alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/analysis/run:
    get:
      tags:
        - Alerts & Engine
      summary: Trigger analysis engine on demand (GET)
      description: Evaluates recent telemetry, detects anomalies (PR < 0.70), and creates/resolves alerts.
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSummary'
    post:
      tags:
        - Alerts & Engine
      summary: Trigger analysis engine on demand (POST)
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisSummary'

  /api/chat:
    get:
      tags:
        - AI Chatbot
      summary: Natural language solar assistant query
      description: Queries the data-backed chatbot for insights on power generation, PR, yesterday's drops, lost energy, and system health.
      parameters:
        - name: query
          in: query
          required: true
          description: Natural language question
          schema:
            type: string
            example: "What is my current power generation?"
      responses:
        '200':
          description: Chatbot answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  response:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags:
        - Authentication & Users
      summary: Public user registration (Owner role strictly)
      description: Creates a new user in Firebase Authentication and Firestore profile. Self-registration is strictly restricted to role 'owner'. Attempting 'admin' or 'technician' returns 403 Forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: owner@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: secret123
                name:
                  type: string
                  example: Jane Doe
                role:
                  type: string
                  enum: [owner]
                  default: owner
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error or password too short
        '403':
          description: Privilege escalation attempt rejected
        '409':
          description: User with email already exists
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/auth/users:
    post:
      tags:
        - Authentication & Users
      summary: Admin-only user creation
      description: Allows an authenticated Admin to create technician, admin, or owner accounts.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                name:
                  type: string
                role:
                  type: string
                  enum: [owner, technician, admin]
      responses:
        '201':
          description: User created successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication & Users
      summary: Current user profile
      description: Returns the authenticated user's profile from Firestore based on the verified Firebase Bearer token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'

  /api/auth/admin-only:
    get:
      tags:
        - Authentication & Users
      summary: Admin role verification test endpoint
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Welcome message for Admin
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'

  /api/auth/tech-only:
    get:
      tags:
        - Authentication & Users
      summary: Technician/Admin role verification test endpoint
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Welcome message for Technician or Admin
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'

  /api/sites:
    post:
      tags:
        - Solar Sites
      summary: Create solar site
      description: Creates a physical site entity. Allowed for Owner (creates for self) and Admin. Technician -> 403 Forbidden.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreatePayload'
      responses:
        '201':
          description: Site created successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Solar Sites
      summary: List solar sites
      description: Returns sites accessible to user (Owner: own sites; Tech: assigned sites; Admin: all sites).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Site'

  /api/sites/{site_id}:
    get:
      tags:
        - Solar Sites
      summary: Get single solar site
      security:
        - BearerAuth: []
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Site details
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Solar Sites
      summary: Update solar site
      security:
        - BearerAuth: []
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_name:
                  type: string
                address:
                  type: string
                location:
                  $ref: '#/components/schemas/Location'
      responses:
        '200':
          description: Site updated successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Solar Sites
      summary: Delete solar site
      security:
        - BearerAuth: []
      parameters:
        - name: site_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Site deleted successfully
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/systems:
    post:
      tags:
        - Solar Systems
      summary: Create solar system installation
      description: Creates a solar system record. Allowed for Owner and Admin. Technician -> 403 Forbidden.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCreatePayload'
      responses:
        '201':
          description: System created successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Solar Systems
      summary: List solar systems
      description: Returns systems accessible to authenticated user (Owner: own; Tech: actively assigned; Admin: all).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/System'

  /api/systems/{system_id}:
    get:
      tags:
        - Solar Systems
      summary: Get single solar system
      security:
        - BearerAuth: []
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: System details
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Solar Systems
      summary: Update solar system
      security:
        - BearerAuth: []
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                location:
                  $ref: '#/components/schemas/Location'
                installation_date:
                  type: string
                  format: date-time
                panel_capacity_watts:
                  type: number
                inverter_type:
                  type: string
                components:
                  type: array
                  items:
                    $ref: '#/components/schemas/Component'
                qr_code_data:
                  type: string
                site_id:
                  type: string
      responses:
        '200':
          description: System updated successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Solar Systems
      summary: Delete solar system (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: System deleted successfully
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/systems/{system_id}/health:
    get:
      tags:
        - Machine Learning & Health
      summary: Get Solar Health Score for system
      description: Returns standardized health score (0-100), status ('Excellent', 'Good', 'Warning', 'Critical', 'N/A'), and loss metrics.
      security:
        - BearerAuth: []
      parameters:
        - name: system_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: System health analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthScoreResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/assignments:
    post:
      tags:
        - Technician Assignments
      summary: Assign technician to site or system (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - technician_uid
              properties:
                technician_uid:
                  type: string
                system_id:
                  type: string
                site_id:
                  type: string
      responses:
        '201':
          description: Assignment created successfully
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Active assignment already exists
    get:
      tags:
        - Technician Assignments
      summary: List technician assignments
      description: Admin sees all assignments; Technician sees own active assignments; Owner -> 403 Forbidden.
      security:
        - BearerAuth: []
      parameters:
        - name: technician_uid
          in: query
          schema:
            type: string
        - name: system_id
          in: query
          schema:
            type: string
        - name: site_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'

  /api/assignments/{assignment_id}:
    delete:
      tags:
        - Technician Assignments
      summary: Delete technician assignment (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: assignment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Assignment deleted successfully
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/reports/daily:
    get:
      tags:
        - Solar Reports
      summary: Daily solar performance report
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          description: Date in YYYY-MM-DD format
          schema:
            type: string
            example: "2026-08-21"
        - name: system_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Daily report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/reports/weekly:
    get:
      tags:
        - Solar Reports
      summary: Weekly/Date-range solar performance report
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            example: "2026-08-15"
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            example: "2026-08-21"
        - name: system_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Weekly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/reports/monthly:
    get:
      tags:
        - Solar Reports
      summary: Monthly solar performance report
      security:
        - BearerAuth: []
      parameters:
        - name: month
          in: query
          required: true
          description: Month in YYYY-MM format
          schema:
            type: string
            example: "2026-08"
        - name: system_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Monthly report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

  /api/ml/train:
    post:
      tags:
        - Machine Learning & Health
      summary: Train ML regression model (Admin only)
      description: Trains capacity-normalized linear regression model with chronological 80/20 train/test split.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Model trained successfully
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/ml/predict:
    get:
      tags:
        - Machine Learning & Health
      summary: Predict solar power generation
      description: Computes ML prediction from environmental parameters.
      security:
        - BearerAuth: []
      parameters:
        - name: irradiance
          in: query
          required: false
          schema:
            type: number
            example: 850.0
        - name: lux
          in: query
          required: false
          description: Auxiliary lux fallback if irradiance is omitted
          schema:
            type: number
        - name: panel_temp
          in: query
          required: true
          schema:
            type: number
            example: 42.5
        - name: humidity
          in: query
          required: true
          schema:
            type: number
            example: 45.0
        - name: hour_of_day
          in: query
          required: true
          schema:
            type: integer
            example: 13
        - name: day_of_week
          in: query
          required: true
          schema:
            type: integer
            example: 4
        - name: system_capacity_kw
          in: query
          required: false
          schema:
            type: number
            default: 1.0
            example: 5.0
      responses:
        '200':
          description: Prediction response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Model not trained yet
        '500':
          $ref: '#/components/schemas/ErrorResponse'

  /api/documents/upload:
    post:
      tags:
        - Documents & Files
      summary: Upload document metadata & binary file
      description: Uploads document binary to Firebase Cloud Storage, validates magic bytes, and records metadata + audit log in Firestore.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - type
                - file
              properties:
                file:
                  type: string
                  format: binary
                system_id:
                  type: string
                site_id:
                  type: string
                type:
                  type: string
                  enum: [invoice, manual, warranty, photo, commissioning_report, site_insurance, site_agreement, site_blueprint, site_permit, site_safety, contract, other]
                format:
                  type: string
                  enum: [PDF, JPG, JPEG, PNG]
                issue_date:
                  type: string
                  format: date
                expiry_date:
                  type: string
                  format: date
                metadata:
                  type: string
                  description: JSON-encoded metadata object
          application/json:
            schema:
              type: object
              required:
                - type
                - filename
                - file_url
              properties:
                system_id:
                  type: string
                site_id:
                  type: string
                type:
                  type: string
                filename:
                  type: string
                format:
                  type: string
                file_url:
                  type: string
                file_size:
                  type: integer
                issue_date:
                  type: string
                expiry_date:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Document uploaded and registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  document:
                    $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/schemas/ErrorResponse'

